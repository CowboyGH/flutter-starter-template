name: flutter_starter_template
description: A scalable Flutter Starter Template for building production-ready business applications.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

license: "MIT"

dependencies:
  bloc_test: ^10.0.0
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.0.3
  dio: ^5.9.0
  equatable: ^2.0.7
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0
  firebase_storage: ^13.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.1
  freezed_annotation: ^3.1.0
  get_it: ^8.2.0
  go_router: ^16.3.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.6.2
  mockito: ^5.5.0
  native_splash_screen: ^3.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  retrofit: ^4.7.3
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.7.1
  freezed: ^3.2.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.1
  retrofit_generator: ^10.0.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/splash/
  
  # fonts: