name: flutter_starter_template
description: A scalable Flutter Starter Template for building production-ready business applications.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

license: "MIT"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/splash/
  
