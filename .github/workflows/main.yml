name: Flutter CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.4'
  ANDROID_SDK_VERSION: '35'

jobs:
  # ==========================================
  # Job 1: Code Quality & Analysis
  # ==========================================
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Verify formatting
        run: dart format --set-exit-if-changed lib/ test/
        continue-on-error: false
      
      - name: Analyze code
        run: flutter analyze --fatal-infos
      
      - name: Run tests
        run: flutter test --coverage || echo "⚠️ No tests found"
      
      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # Job 2: Android Build with Docker
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 60
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/flutter-starter-android
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
            ANDROID_SDK_VERSION=${{ env.ANDROID_SDK_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Extract APK from Docker image
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Using image: ${IMAGE_TAG}"
          
          docker create --name temp-flutter "${IMAGE_TAG}"
          mkdir -p apk-output
          docker cp temp-flutter:/artifacts/. apk-output/
          docker rm temp-flutter
          
          if [ ! "$(ls -A apk-output/*.apk 2>/dev/null)" ]; then
            echo "ERROR: No APK files found in apk-output/"
            exit 1
          fi
          
          echo "Successfully extracted APK files:"
          ls -lh apk-output/
      
      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: apk-output/*.apk
          retention-days: 30
          compression-level: 0
      
      - name: Generate build summary
        run: |
          echo "## 🤖 Android APK Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Info:**" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Flutter: \`${{ env.FLUTTER_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Android SDK: \`${{ env.ANDROID_SDK_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | Filename | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|----------|------|" >> $GITHUB_STEP_SUMMARY
          
          for apk in apk-output/*.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk")
              size=$(du -h "$apk" | cut -f1)
              
              if [[ "$filename" == *"arm64-v8a"* ]]; then
                arch="ARM64 (64-bit)"
              elif [[ "$filename" == *"armeabi-v7a"* ]]; then
                arch="ARMv7 (32-bit)"
              elif [[ "$filename" == *"x86_64"* ]]; then
                arch="x86_64"
              else
                arch="Universal"
              fi
              
              echo "| $arch | \`$filename\` | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "🐳 **Docker Image:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ *Docker image not pushed (Pull Request build)*" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # Job 3: iOS Build (macOS runner)
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: analyze
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get

      - name: Install iOS dependencies
        run: |
          cd ios
          pod install || echo "No Podfile found, skipping pod install"
          cd ..
      
      - name: Build iOS app (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}
      
      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          
          IPA_NAME="flutter-starter-ios-${{ github.run_number }}-unsigned.ipa"
          zip -r "$IPA_NAME" Payload
          
          rm -rf Payload
          
          echo "IPA created: $IPA_NAME"
          ls -lh *.ipa
      
      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: "*.ipa"
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      
      - name: Generate iOS build summary
        run: |
          echo "## 🍎 iOS IPA Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Info:**" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Flutter: \`${{ env.FLUTTER_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Build Number: \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          
          for ipa in *.ipa; do
            if [ -f "$ipa" ]; then
              size=$(du -h "$ipa" | cut -f1)
              echo "| \`$ipa\` | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note**: This is an unsigned IPA for testing purposes only." >> $GITHUB_STEP_SUMMARY
          echo "For App Store distribution, code signing is required." >> $GITHUB_STEP_SUMMARY
